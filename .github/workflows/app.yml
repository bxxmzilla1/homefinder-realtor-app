name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'iOSApp/**'
      - '.github/workflows/app.yml'
jobs:
  build:
    runs-on: macos-15          # MUST be macos-15 (Xcode 16): XcodeGen emits
    defaults:                  # project format 77 which Xcode 15 cannot read.
      run:
        working-directory: iOSApp
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Inject default server settings
        env:
          APP_SERVER_URL: ${{ secrets.APP_SERVER_URL }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
        run: |
          cat > Sources/BuildConfig.swift <<EOF
          enum BuildConfig {
              static let defaultServerURL = "${APP_SERVER_URL}"
              static let defaultAPIKey = "${APP_API_KEY}"
          }
          EOF
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (unsigned)
        run: |
          xcodebuild \
            -project HomeFinder.xcodeproj \
            -scheme HomeFinder \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HomeFinder.app Payload/
          zip -qr HomeFinder.ipa Payload
          ls -la HomeFinder.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: HomeFinder-ipa
          path: iOSApp/HomeFinder.ipa
