name: HomeFinder
options:
  bundleIdPrefix: com.sideload.homefinder
  deploymentTarget:
    iOS: "15.0"
targets:
  HomeFinder:
    type: application
    platform: iOS
    sources:
      - Sources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: HomeFinder
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: HomeFinder connects to your listings server on your local network.
        NSLocationWhenInUseUsageDescription: HomeFinder uses your location to center the map near you.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sideload.homefinder.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HomeFinder
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        DEVELOPMENT_TEAM: ""
        CODE_SIGNING_ALLOWED: NO
